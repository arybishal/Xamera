<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B10" />
      <stop offset="50%" stop-color="#0F141C" />
      <stop offset="100%" stop-color="#05070A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#3D7BFF" />
      <stop offset="100%" stop-color="#FF9100" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0A0F1D" />
    </linearGradient>
    <radialGradient id="glassReflection" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#3D7BFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1196" height="416" x="2" y="2" rx="14" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />

  <!-- Cyber Grid Subtle Background -->
  <g stroke="rgba(255,255,255,0.025)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="500" y1="0" x2="500" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    <line x1="1100" y1="0" x2="1100" y2="420" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
  </g>

  <!-- Left: Stylized Camera Lens Graphic -->
  <g transform="translate(180, 210)">
    <!-- Outer Knurled Ring -->
    <circle r="130" fill="none" stroke="#252F40" stroke-width="8" stroke-dasharray="6,4" />
    <circle r="120" fill="url(#lensGrad)" stroke="#38455C" stroke-width="2" />
    <circle r="102" fill="#0C101A" stroke="#00E5FF" stroke-width="2" opacity="0.6" />
    <!-- Glass Element -->
    <circle r="90" fill="url(#glassReflection)" />
    <!-- Aperture Blades -->
    <polygon points="-35,-50 40,-60 65,15 15,65 -50,45 -65,-20" fill="none" stroke="#FF9100" stroke-width="1.5" opacity="0.4" />
    <!-- Center Pupil -->
    <circle r="36" fill="#030508" stroke="#00E5FF" stroke-width="2" filter="url(#glow)" />
    <circle r="12" fill="#00E5FF" opacity="0.8" />
    <!-- Lens Telemetry Markings -->
    <text x="-70" y="-106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="1.5">F/1.88 · 50MP OIS · 24MM</text>
    <text x="-65" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="700" fill="#00E5FF" letter-spacing="2">3D LUT · 120HZ LTPO</text>
  </g>

  <!-- Right: Title, Subtitle, Badges & Feature Highlights -->
  <g transform="translate(420, 80)">
    <!-- Brand Tag -->
    <rect x="0" y="0" width="310" height="28" rx="6" fill="#131F33" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.4" />
    <text x="14" y="19" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="800" fill="#00E5FF" letter-spacing="2">ONEPLUS ACE 5 / 13R PRO CAMERA</text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="-1">XAMERA</text>
    <text x="300" y="90" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="32" font-weight="800" fill="url(#accentGrad)" letter-spacing="0">v1.0.0</text>

    <!-- Description -->
    <text x="0" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="18" font-weight="400" fill="#CBD5E1">
      Cinematic Manual Camera &amp; Computational Imaging Engine
    </text>
    <text x="0" y="156" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" fill="#64748B">
      Snapdragon 8 Gen 3 · Adreno 750 · 120Hz LTPO · 100% On-Device &amp; Offline
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 195)">
      <!-- Pill 1: RAW/DNG -->
      <rect x="0" y="0" width="135" height="34" rx="8" fill="#151C28" stroke="#334155" stroke-width="1" />
      <text x="16" y="22" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">📸 Lossless DNG</text>

      <!-- Pill 2: 3D LUTs -->
      <rect x="145" y="0" width="145" height="34" rx="8" fill="#151C28" stroke="#334155" stroke-width="1" />
      <text x="161" y="22" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">🎨 3D LUT Studio</text>

      <!-- Pill 3: HDR+ Fusion -->
      <rect x="300" y="0" width="135" height="34" rx="8" fill="#151C28" stroke="#334155" stroke-width="1" />
      <text x="316" y="22" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">⚡ 5-Frame HDR+</text>

      <!-- Pill 4: Zero Trackers -->
      <rect x="445" y="0" width="155" height="34" rx="8" fill="#151C28" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.3" />
      <text x="461" y="22" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="700" fill="#00E5FF">🔒 100% Offline</text>
    </g>

    <!-- Developer Attribution -->
    <g transform="translate(0, 260)">
      <text x="0" y="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="500" fill="#475569">
        Architected &amp; Engineered by <tspan fill="#F8FAFC" font-weight="700">Bishal Aryal</tspan> · <tspan fill="#00E5FF">https://bishalaryal.com.np</tspan>
      </text>
    </g>
  </g>
</svg>
